name: Content system validation

on:
  push:
    branches:
      - main
      - "test/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate sample content
        run: node scripts/validate-content.mjs content/samples/reading-demo.json
      - name: Run content validator tests
        run: node --test tests/content-validator.test.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run prototype browser smoke test
        run: node --test tests/prototype.browser.test.mjs
